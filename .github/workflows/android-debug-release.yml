name: Android Debug APK & GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AGP version is 9.1.1
        run: |
          if ! grep -Eq '^agp[[:space:]]*=[[:space:]]*"9\.1\.1"' gradle/libs.versions.toml; then
            echo "ERROR: Expected agp = \"9.1.1\" in gradle/libs.versions.toml"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify Debug APK exists
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilive-arcade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Debug APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BASE_TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=""
            RELEASE_TITLE="Mobilive Arcade ${BASE_TAG}"
          else
            BASE_TAG="debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            PRERELEASE_FLAG="--prerelease"
            RELEASE_TITLE="Mobilive Arcade Debug Build #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          RELEASE_TAG="${BASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            RELEASE_TAG="${BASE_TAG}-r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
            RELEASE_TITLE="${RELEASE_TITLE} (${RELEASE_TAG})"
          fi

          # Create as draft first, attach the APK, then publish so GitHub Immutable Releases
          # never fails trying to modify or delete assets on a published release.
          gh release create "${RELEASE_TAG}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            ${PRERELEASE_FLAG}

          gh release upload "${RELEASE_TAG}" "${APK_PATH}"
          gh release edit "${RELEASE_TAG}" --draft=false
